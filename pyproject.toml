[project]
name = "erasmusgravity"
version = "0.1.0"
description = "Descriptive analysis of Erasmus mobility flows and economic gaps between sending and receiving countries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "country-converter>=1.3",
    "geonamescache>=3.0.1",
    "google-genai>=1.74.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2,<3",
    "pyarrow>=20.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "scipy>=1.15",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
text = [
    "google-genai>=1.14",
    "pydantic>=2.11",
]
geo = [
    "geopandas>=1.0",
    "geopy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erasmusgravity"]
